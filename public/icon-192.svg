<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#00D8FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="192" height="192" rx="42" fill="#0b0f19" />
  <rect x="8" y="8" width="176" height="176" rx="36" fill="url(#bgGrad)" fill-opacity="0.12" stroke="url(#bgGrad)" stroke-width="2.5" />
  
  <!-- Bicycle Icon Graphic -->
  <g transform="translate(36, 40) scale(5)" filter="url(#glow)">
    <!-- Rear Wheel -->
    <circle cx="5.5" cy="17.5" r="3.5" fill="none" stroke="#00D8FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Front Wheel -->
    <circle cx="18.5" cy="17.5" r="3.5" fill="none" stroke="#00D8FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Rider & Frame -->
    <path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5V14l-3-3 4-3 2 3h2" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Chainstay & Top Tube -->
    <path d="M5.5 17.5l4.5-5.5h4" fill="none" stroke="#00D8FF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
