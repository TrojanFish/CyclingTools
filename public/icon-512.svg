<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#00D8FF" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00D8FF" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="#0b0f19" />
  <rect x="20" y="20" width="472" height="472" rx="96" fill="url(#bgGrad512)" fill-opacity="0.12" stroke="url(#bgGrad512)" stroke-width="6" />
  
  <!-- Bicycle Icon Graphic -->
  <g transform="translate(96, 110) scale(13.4)" filter="url(#glow512)">
    <!-- Rear Wheel -->
    <circle cx="5.5" cy="17.5" r="3.5" fill="none" stroke="#00D8FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
