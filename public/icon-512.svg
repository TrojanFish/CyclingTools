<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.38" />
    </filter>
  </defs>
  
  <!-- Crisp White Background (白底) -->
  <rect width="512" height="512" fill="#FFFFFF" />
  
  <!-- Rounded Blue Squircle (蓝表 / 蓝标 - from Navbar Logo) -->
  <rect x="66" y="66" width="380" height="380" rx="92" fill="url(#badgeGrad)" filter="url(#badgeShadow)" />
  
  <!-- Cycling Science Bike Emblem in Crisp White -->
  <g transform="translate(138.00, 138.00) scale(9.833)" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Rear Wheel -->
    <circle cx="5.5" cy="17.5" r="3.5" />
    <!-- Front Wheel -->
    <circle cx="18.5" cy="17.5" r="3.5" />
    <!-- Rider Head -->
    <circle cx="15" cy="5" r="1.15" fill="#FFFFFF" />
    <!-- Rider Torso, Arm & Seat Tube -->
    <path d="M12 17.5V14l-3-3 4-3 2 3h2" />
    <!-- Bike Frame Chainstay & Top Tube -->
    <path d="M5.5 17.5l4.5-5.5h4" stroke-width="1.6" />
    <!-- Front Fork -->
    <path d="M15 11l3.5 6.5" stroke-width="1.6" />
  </g>
</svg>