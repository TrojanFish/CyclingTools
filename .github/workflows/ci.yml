name: CI Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gate:
    name: Typecheck, HIG Audit, Unit Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: npm ci

      - name: 1. Apple HIG Compliance Audit
        run: python .agents/skills/apple-hig-compliance/scripts/hig_checker.py scan src

      - name: 2. TypeScript Strict Typecheck
        run: npx tsc --noEmit

      - name: 3. Unit Test Suite (Superpowers TDD)
        run: npm run test

      - name: 4. Production Build Verification
        run: npm run build
