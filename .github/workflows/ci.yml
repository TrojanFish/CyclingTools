name: CI Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gate:
    name: Typecheck, HIG Audit, Unit Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: npm ci

      - name: 1. Apple HIG Compliance Audit
        run: python .agents/skills/apple-hig-compliance/scripts/hig_checker.py scan src

      - name: 2. Defensive Code Quality & Telemetry Audit
        run: python .agents/skills/cycling-telemetry-pipeline/scripts/defensive_checker.py scan src

      - name: 3. TypeScript Strict Typecheck
        run: npx tsc --noEmit

      - name: 4. Unit Test Suite (Superpowers TDD)
        run: npm run test

      - name: 5. Production Build Verification
        run: npm run build

  lighthouse:
    name: Lighthouse CI (Performance / SEO / A11y)
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        run: lhci autorun
        continue-on-error: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 14
